meta:
  start_date: '2026-04-15'
  initial_capital: 50000
  strategy: BaseLine组合版 (砖型图+B1+止盈止损+回撤止损v5)
  rules:
    max_positions: 3
    observe_note: 法尔胜/高能环境因蜡烛图分析判断走势不佳（法尔胜：急跌后低位横盘缺方向/高能环境：看跌吞没+弱反弹+十字星乏力），转为观察仓。观察仓不操作买卖，仅跟踪理论盈亏。若后续出现新的优质信号，仍可新开操作仓。
    max_single_pct: 50
    buy_price_brick: min(信号日收盘×0.995, 次日开盘×0.99)
    buy_price_b1: min(信号日收盘×0.993, 次日开盘×0.988)
    position_sizing: 等权开仓 (cash / slots), avg5(1,2]纯B1降权budget×0.5
    omav_control: bear不开仓, warn限1只(仅共振), 正常最多3只
    fees: 佣金万0.86(最低5元), 印花税万5(仅卖出)
    excluded_industries: 航空/电气设备/旅游服务/黄金/全国地产/轻工机械/农药化肥/石油贸易/矿物制品/专用机械/化纤/装修装饰/其他商业/焦炭加工
    signal_source: 砖型图V3旋转图信号 + B1封板信号 (combo)
    sorting: 共振>砖型图>纯B1, 同类按J值排序
    brick_sell: 持1天, 次日收盘卖出
    b1_tp2: +20%全走
    b1_tp1: +10%卖半仓, 设回撤止损线=TP1当天最低价×0.93
    b1_trailing_sl: TP1后收盘≤止损线→全走
    b1_yellow_sl: 收盘<黄线→全走
    b1_max_hold: 10天到期收盘卖出

candidate_filters:
  exclude_st: true
  exclude_markets:
    - 北交所
    - 创业板
  avoid_industries:
    - 区域地产
    - 全国地产
    - 房产服务
    - 园区开发
    - 其他商业
  hard_exclude_theme_note: 房地产相关方向无论走势如何一律不做
  prefer_industries:
    - 半导体
    - 元器件
    - 电气设备
    - 医药商业
    - 白酒
    - 消费电子
    - 软件服务
    - 化学制药
  core_watch_industries:
    - 半导体
    - 元器件
    - 医药商业
    - 化学制药
    - 白酒
    - 消费电子
  preference_mode: weak_reference
  preference_note: 不做强偏好硬过滤，市场盘面与基本面优先，行业偏好仅作弱参考。
  min_price: 5
  max_price: 500
  top_n_candidates: 8

rotation:
  lookback_days: 10
  highlight_top_n: 5
  practical_preferred_industries:
    - 半导体
    - 元器件
    - 医药商业
    - 化学制药
    - 白酒
    - 消费电子
    - 软件服务
